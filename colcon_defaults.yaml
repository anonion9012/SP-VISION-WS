build:
  parallel-workers: 2
  cmake-args:
    - -DCMAKE_BUILD_PARALLEL_LEVEL=2
    - -DPython3_EXECUTABLE=/usr/bin/python3
    - -Dfmt_DIR=/usr/lib/x86_64-linux-gnu/cmake/fmt
    - -Dspdlog_DIR=/usr/lib/x86_64-linux-gnu/cmake/spdlog
    - -Dyaml-cpp_DIR=/usr/lib/x86_64-linux-gnu/cmake/yaml-cpp
    - -Dnlohmann_json_DIR=/usr/lib/cmake/nlohmann_json
    - -DTBB_DIR=/usr/lib/x86_64-linux-gnu/cmake/TBB
    - -Dgflags_DIR=/usr/lib/x86_64-linux-gnu/cmake/gflags
    - -Dglog_DIR=/usr/lib/x86_64-linux-gnu/cmake/glog
